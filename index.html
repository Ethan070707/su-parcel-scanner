<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>SU Parcel Scanner</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-deep: #0a1628;
  --bg-card: #111d33;
  --bg-input: #162240;
  --border: #1e3055;
  --border-focus: #3b82f6;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.25);
  --success: #22c55e;
  --success-glow: rgba(34, 197, 94, 0.2);
  --warning: #f59e0b;
  --danger: #ef4444;
  --text-primary: #e8edf5;
  --text-secondary: #8899b4;
  --text-muted: #56687a;
  --radius: 12px;
  --radius-sm: 8px;
}
html, body {
  height: 100%;
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 22, 40, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: white;
  flex-shrink: 0;
}
.header-text h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.header-text p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
/* 齿轮改成正常流内元素，不再 position:absolute（原来会和右侧按钮重叠） */
.config-trigger {
  margin-left: auto;
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
}
.config-trigger svg { width: 20px; height: 20px; }
.config-trigger.alert { color: var(--warning); }
/* ===== MAIN CONTENT ===== */
.main {
  padding: 16px;
  padding-bottom: 100px;
  max-width: 480px;
  margin: 0 auto;
}
/* ===== PENDING QUEUE BAR ===== */
.pending-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--warning);
}
.pending-bar.active { display: flex; }
.pending-bar span { flex: 1; }
.pending-bar button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background: var(--warning);
  color: #1a1200;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.pending-bar button:disabled { opacity: 0.5; pointer-events: none; }
/* ===== SCAN SECTION ===== */
.scan-section { margin-bottom: 20px; }
.scan-actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.scan-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 20px 12px;
  background: var(--bg-card);
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s;
}
.scan-btn:active {
  transform: scale(0.97);
  border-color: var(--accent);
  background: rgba(59, 130, 246, 0.08);
}
.scan-btn svg { width: 28px; height: 28px; stroke: var(--accent); }
.scan-btn.scanning {
  border-color: var(--accent);
  background: rgba(59, 130, 246, 0.06);
  animation: pulse-border 1.5s infinite;
}
@keyframes pulse-border {
  0%, 100% { border-color: var(--accent); }
  50% { border-color: var(--accent-glow); }
}
/* Scanner viewport */
.scanner-viewport {
  display: none;
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 12px;
}
.scanner-viewport.active { display: block; }
.scanner-viewport video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.scanner-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scan-region {
  width: 70%;
  height: 40%;
  border: 2px solid rgba(59, 130, 246, 0.6);
  border-radius: 12px;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
}
.scan-hint {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  text-align: center;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.scan-region::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: scan-line 2s ease-in-out infinite;
}
.scanner-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  -webkit-mask:
    linear-gradient(#000 0 0) top/100% calc(30%) no-repeat,
    linear-gradient(#000 0 0) bottom/100% calc(30%) no-repeat,
    linear-gradient(#000 0 0) left/calc(15%) 100% no-repeat,
    linear-gradient(#000 0 0) right/calc(15%) 100% no-repeat;
  mask:
    linear-gradient(#000 0 0) top/100% calc(30%) no-repeat,
    linear-gradient(#000 0 0) bottom/100% calc(30%) no-repeat,
    linear-gradient(#000 0 0) left/calc(15%) 100% no-repeat,
    linear-gradient(#000 0 0) right/calc(15%) 100% no-repeat;
  pointer-events: none;
}
@keyframes scan-line {
  0%, 100% { top: 0; }
  50% { top: calc(100% - 2px); }
}
.scanner-close {
  position: absolute;
  top: 8px; right: 8px;
  width: 32px; height: 32px;
  background: rgba(0,0,0,0.6);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
/* Barcode confirmation overlay */
.scan-confirm {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.scan-confirm.active { display: flex; }
.scan-confirm-content { text-align: center; padding: 20px; width: 100%; }
.scan-confirm-icon {
  width: 48px; height: 48px;
  margin: 0 auto 10px;
  background: var(--success);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: white;
  animation: pop-in 0.3s ease;
}
@keyframes pop-in {
  0% { transform: scale(0); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.scan-confirm-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}
.scan-confirm-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 600;
  color: white;
  letter-spacing: 1px;
  margin-bottom: 6px;
  word-break: break-all;
  padding: 0 10px;
}
.scan-confirm-courier {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 18px;
  min-height: 20px;
}
.scan-confirm-buttons { display: flex; gap: 10px; justify-content: center; }
.scan-confirm-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.scan-confirm-btn:active { transform: scale(0.95); }
.scan-confirm-btn.accept { background: var(--success); color: white; }
.scan-confirm-btn.reject { background: rgba(255,255,255,0.12); color: var(--text-secondary); }
/* Multi-barcode selection */
.scan-multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
.scan-multi-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
  padding: 0 10px;
}
.scan-multi-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.scan-multi-item:active {
  background: rgba(59, 130, 246, 0.2);
  border-color: var(--accent);
}
.scan-multi-item-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: white;
  letter-spacing: 0.5px;
  word-break: break-all;
  text-align: left;
}
.scan-multi-item-courier {
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
  flex-shrink: 0;
}
/* Photo preview */
.photo-preview {
  display: none;
  position: relative;
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.photo-preview.active { display: block; }
.photo-preview img { width: 100%; display: block; }
/* AI Status */
.ai-status {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--accent);
  line-height: 1.4;
}
.ai-status.active { display: flex; }
.ai-status.success {
  background: var(--success-glow);
  border-color: rgba(34, 197, 94, 0.3);
  color: var(--success);
}
.ai-status.error {
  background: rgba(239, 68, 68, 0.08);
  border-color: rgba(239, 68, 68, 0.2);
  color: var(--danger);
}
.ai-spinner {
  width: 18px; height: 18px;
  border: 2px solid transparent;
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
.ai-status.success .ai-spinner,
.ai-status.error .ai-spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ===== FORM ===== */
.form-section { display: flex; flex-direction: column; gap: 12px; }
.form-group { position: relative; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.form-group input, .form-group textarea {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group input.ai-filled, .form-group textarea.ai-filled {
  border-color: rgba(34, 197, 94, 0.4);
  background: rgba(34, 197, 94, 0.05);
}
.form-group input.field-error {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
}
.sender-chip.suggest {
  border-color: var(--warning);
  color: var(--warning);
  background: rgba(245, 158, 11, 0.1);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sender-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sender-chip {
  padding: 5px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.sender-chip:active, .sender-chip.active {
  background: rgba(59, 130, 246, 0.15);
  border-color: var(--accent);
  color: var(--accent);
}
/* Submit */
.submit-bar {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(10, 22, 40, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 100;
  display: flex;
  gap: 10px;
}
.btn-submit {
  flex: 1;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #2563eb);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.2px;
}
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { opacity: 0.4; pointer-events: none; }
.btn-clear {
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-140px);
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s ease;
  max-width: calc(100vw - 32px);
  text-align: center;
  line-height: 1.4;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); color: white; }
.toast.error { background: var(--danger); color: white; }
/* Config modal */
.config-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.config-overlay.active { display: flex; }
.config-modal {
  background: var(--bg-card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}
.config-modal h3 {
  font-size: 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.config-modal .form-group { margin-bottom: 14px; }
.config-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  line-height: 1.5;
}
.config-modal .btn-save {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.btn-diagnose {
  width: 100%;
  padding: 11px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 10px;
}
.diag-result {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.diag-result.active { display: block; }
.diag-result.ok { background: var(--success-glow); color: var(--success); }
.diag-result.bad { background: rgba(239,68,68,0.1); color: var(--danger); }
.diag-result.info { background: rgba(59,130,246,0.1); color: var(--accent); }
/* Hidden file inputs */
#photoInput, #barcodeCaptureInput { display: none; }
/* Section label */
.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
</style>
</head>
<body>
<!-- Header -->
<div class="header">
  <div class="header-logo">SU</div>
  <div class="header-text">
    <h1>Parcel Scanner</h1>
    <p>Singunion Agency &middot; Inbound Records</p>
  </div>
  <button class="config-trigger" id="configTrigger" onclick="toggleConfig()" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
  </button>
</div>

<!-- Main -->
<div class="main">

  <!-- Unsent parcels queue -->
  <div class="pending-bar" id="pendingBar">
    <span id="pendingText"></span>
    <button id="pendingBtn" onclick="retryPending()">Retry</button>
  </div>

  <!-- Scan Section -->
  <div class="scan-section">
    <div class="section-label">Quick Capture</div>
    <div class="scan-actions">
      <button class="scan-btn" id="btnBarcode" onclick="startBarcodeScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="8" x2="6" y2="16"/><line x1="9" y1="8" x2="9" y2="16"/><line x1="12" y1="8" x2="12" y2="16" stroke-width="2"/><line x1="15" y1="8" x2="15" y2="16"/><line x1="18" y1="8" x2="18" y2="16"/></svg>
        Barcode
      </button>
      <button class="scan-btn" id="btnQR" onclick="startQRScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="5" y="5" width="2" height="2"/><rect x="17" y="5" width="2" height="2"/><rect x="5" y="17" width="2" height="2"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2zM16 16h2v2h-2z"/></svg>
        QR Code
      </button>
      <button class="scan-btn" id="btnPhoto" onclick="takePhoto()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Photo Label
      </button>
    </div>

    <!-- Barcode scanner viewport (desktop / Android live scan) -->
    <div class="scanner-viewport" id="scannerViewport">
      <video id="scannerVideo" autoplay playsinline muted></video>
      <canvas id="scannerCanvas" style="display:none;"></canvas>
      <div class="scanner-overlay">
        <div class="scan-region">
          <div class="scan-hint">Align barcode here</div>
        </div>
      </div>
      <button class="scanner-close" onclick="stopBarcodeScan()">&#10005;</button>
      <div class="scan-confirm" id="scanConfirm">
        <div class="scan-confirm-content">
          <div class="scan-confirm-icon">&#10003;</div>
          <div class="scan-confirm-label">Barcode Detected</div>
          <div class="scan-confirm-code" id="scanConfirmCode"></div>
          <div class="scan-confirm-courier" id="scanConfirmCourier"></div>
          <div class="scan-confirm-buttons">
            <button class="scan-confirm-btn reject" onclick="rescanBarcode()">&#10005; Rescan</button>
            <button class="scan-confirm-btn accept" onclick="acceptBarcode()">&#10003; Use This</button>
          </div>
        </div>
      </div>
      <div class="scan-confirm" id="scanMulti">
        <div class="scan-confirm-content">
          <div class="scan-confirm-icon" style="background:var(--accent);">?</div>
          <div class="scan-confirm-label">Multiple Barcodes Found</div>
          <div class="scan-multi-hint">Tap the correct one:</div>
          <div class="scan-multi-list" id="scanMultiList"></div>
          <div class="scan-confirm-buttons" style="margin-top:12px;">
            <button class="scan-confirm-btn reject" onclick="rescanBarcode()">&#10005; Rescan</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Photo preview -->

// ==========================================
// NETWORK HELPERS

function fetchWithTimeout(url, options, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, Object.assign({}, options, { signal: ctrl.signal }))
    .finally(() => clearTimeout(timer));
}

// 把 n8n / Cloudflare 返回的各种错误翻成人话
async function describeError(response) {
  let raw = '';
  try { raw = await response.text(); } catch {}
  let msg = '';
  try {
    const j = JSON.parse(raw);
    if (j && j.message) msg = j.message;
  } catch { msg = (raw || '').slice(0, 160); }

  if (response.status === 401 || response.status === 403) {
    return 'Auth failed (' + response.status + ') — the app key no longer matches n8n. Please contact the administrator.';
  }
  if (response.status === 404) {
    return 'Webhook not found (404) — the n8n workflow may be deactivated.';
  }
  if (response.status === 413) {
    return 'Image rejected by server (413) — too large.';
  }
  if (response.status === 429) {
    return msg || 'Daily OCR limit reached. Please type the details manually.';
  }
  if (response.status >= 500) {
    return 'n8n server error (' + response.status + '). Please try again shortly.';
  }
  return msg || ('Server error ' + response.status);
}

function describeNetworkError(err) {
  if (err && err.name === 'AbortError') return 'Request timed out — check your connection and retry.';
  if (err instanceof TypeError) return 'Cannot reach n8n — no network, or this page is not served from the allowed domain.';
  return err && err.message ? err.message : 'Unknown error';
}

// ==========================================
// BARCODE SCANNING
// ==========================================
let scannerStream = null;
let scanInterval = null;
let pendingBarcode = null;
let stableDetections = {};
let currentScanMode = 'barcode';           // 'barcode' | 'qr'
let activeScanBtnId = null;
const STABLE_THRESHOLD = 3;
const BARCODE_FORMATS = ['code_128', 'code_39', 'ean_13', 'ean_8', 'itf'];
const QR_FORMATS = ['qr_code'];

function getScanFormats() {
  return currentScanMode === 'qr' ? QR_FORMATS : BARCODE_FORMATS;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function startBarcodeScan() {
  currentScanMode = 'barcode';
  // iOS 维持拍照解码（不走实时取景）
  if (isIOS()) { document.getElementById('barcodeCaptureInput').click(); return; }

// 创建 detector：某些浏览器不支持部分格式会抛错，这里逐个降级
function makeDetector() {
  if (!('BarcodeDetector' in window)) return null;
  const wanted = getScanFormats();
  try { return new BarcodeDetector({ formats: wanted }); } catch (e) {}
  try { return new BarcodeDetector(); } catch (e) {}
  return null;
}

async function startScanner(triggerBtnId) {
  const viewport = document.getElementById('scannerViewport');
  const video = document.getElementById('scannerVideo');
  stableDetections = {};
  activeScanBtnId = triggerBtnId;

  const detector = makeDetector();
  if (!detector) {
    showToast('Scanner not supported here — use Photo Label', 'error');
    return;
  }

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = scannerStream;
    await video.play();
    viewport.classList.add('active');
    document.getElementById(triggerBtnId).classList.add('scanning');
    startScanLoop(detector);
  } catch (err) {
    console.error('Camera error:', err);
    // 关键修复：失败时一定要把已经打开的摄像头关掉
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    showToast('Camera not available — use Photo Label', 'error');
  }
}

// 扫描循环（原来 startScanner 和 rescanBarcode 里各写了一份，现在共用）
function startScanLoop(detector) {
  const video = document.getElementById('scannerVideo');
  if (scanInterval) { clearInterval(scanInterval); }
  scanInterval = setInterval(async () => {
    try {
      const centerCodes = await detectCenterRegion(detector, video);

      if (centerCodes.length === 0) {
        for (const key in stableDetections) {
          stableDetections[key] = Math.max(0, stableDetections[key] - 1);
        }
        return;
      }

      const uniqueCodes = [...new Set(centerCodes.map(c => c.rawValue).filter(Boolean))];
      uniqueCodes.forEach(code => {
        stableDetections[code] = (stableDetections[code] || 0) + 1;
      });

      const stableCodes = uniqueCodes.filter(code => stableDetections[code] >= STABLE_THRESHOLD);
      if (stableCodes.length === 0) return;

      clearInterval(scanInterval);
      scanInterval = null;

      if (stableCodes.length === 1) showSingleConfirm(stableCodes[0]);
      else showMultiSelect(stableCodes);
    } catch (e) { /* 单帧解码失败，继续扫 */ }
  }, 300);
}

function rescanBarcode() {
  pendingBarcode = null;
  stableDetections = {};
  hideAllOverlays();
  const detector = makeDetector();
  if (detector && scannerStream) startScanLoop(detector);
}

async function handleBarcodeCapture(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;

  const detector = makeDetector();
  if (!detector) {
    showToast('Scanner not available — use Photo Label', 'error');
    return;
  }

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    try {
      const barcodes = await detector.detect(img);
      const uniqueCodes = [...new Set(barcodes.map(b => b.rawValue).filter(Boolean))];
      if (uniqueCodes.length === 0) {
        showToast('No barcode found — try again or use Photo Label', 'error');
      } else if (uniqueCodes.length === 1) {
        pendingBarcode = uniqueCodes[0];
        acceptBarcode();
      } else {
        const choices = uniqueCodes.map((c, i) => (i + 1) + '. ' + c).join('\n');
        const pick = prompt('Multiple barcodes found:\n' + choices + '\n\nEnter number:');
        const idx = parseInt(pick, 10) - 1;
        if (idx >= 0 && idx < uniqueCodes.length) {
          pendingBarcode = uniqueCodes[idx];
          acceptBarcode();
        }
      }
    } catch (err) {
      console.error('Barcode capture error:', err);
      showToast('Scan failed — use Photo Label instead', 'error');
    }
    URL.revokeObjectURL(url);
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showToast('Could not read that photo — use Photo Label', 'error');
  };
  img.src = url;
}

async function detectCenterRegion(detector, video) {
  const canvas = document.getElementById('scannerCanvas');
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return [];

  const cropW = vw * 0.70;
  const cropH = vh * 0.50;
  const cropX = (vw - cropW) / 2;
  const cropY = (vh - cropH) / 2;

  if (canvas.width !== Math.round(cropW))  canvas.width  = Math.round(cropW);
  if (canvas.height !== Math.round(cropH)) canvas.height = Math.round(cropH);

  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
  return await detector.detect(canvas);
}

function hideAllOverlays() {
  document.getElementById('scanConfirm').classList.remove('active');
  document.getElementById('scanMulti').classList.remove('active');

function showSingleConfirm(code) {
  pendingBarcode = code;

function showMultiSelect(codes) {

    .map(code => Object.assign({ code }, detectCourier(code)))

  ranked.forEach(({ code, courier }) => {

function stopBarcodeScan() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
  document.getElementById('scannerViewport').classList.remove('active');

function acceptBarcode() {
  const code = pendingBarcode;
  if (!code) return;

  stopBarcodeScan();

  const awbEl = document.getElementById('inAwb');
  awbEl.value = code;

// ==========================================
// COURIER DETECTION
//   high -> 字母前缀可确定，自动填
//   low  -> 纯数字按长度猜，只提示不填
// ==========================================
function detectCourier(raw) {
  if (!raw) return { courier: null, confidence: null };
  const tn = String(raw).toUpperCase().replace(/[\s\-\/\.]/g, '');

  const PREFIX_RULES = [
    { re: /^1Z[0-9A-Z]{16}$/,   courier: 'UPS' },
    { re: /^SF\d{13,15}$/,      courier: 'SF Express' },
    { re: /^JT\d{12,16}$/,      courier: 'J&T Express' },
    { re: /^SPNDD\d{8,10}$/,    courier: 'Singpost' },
    { re: /^[A-Z]{2}\d{9}SG$/,  courier: 'Singpost' },
    { re: /^GE\d{9}[A-Z]{2}$/,  courier: 'TNT' },
    { re: /^JJD\d{10,18}$/,     courier: 'DHL' },
    { re: /^JVGL\d{10,18}$/,    courier: 'DHL' }
  ];
  for (const r of PREFIX_RULES) {
    if (r.re.test(tn)) return { courier: r.courier, confidence: 'high' };
  }

  if (/^\d+$/.test(tn)) {
    const len = tn.length;
    if (len === 9)                return { courier: 'TNT',   confidence: 'low' };
    if (len === 10 || len === 11) return { courier: 'DHL',   confidence: 'low' };
    if (len === 12)               return { courier: 'FedEx', confidence: 'low' };
    if (len >= 14 && len <= 22)   return { courier: 'FedEx', confidence: 'low' };
  }
  return { courier: null, confidence: null };
}

// ==========================================
// PHOTO + AI OCR
// ==========================================
function takePhoto() {
  document.getElementById('photoInput').click();
}

// 关键改动：先压缩再上传
// 1) 手机原图 3–8MB，base64 后再涨 33%，会顶到 n8n OCR Guard 的 8MB 上限
// 2) 统一转成 image/jpeg，避免 iPhone HEIC 让 OpenAI Vision 拒收
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (!w || !h) { reject(new Error('Invalid image')); return; }
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] || '', width: w, height: h });
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Cannot read this photo. If your iPhone saves HEIC, set Camera > Formats > Most Compatible.'));
    };
    img.src = url;
  });
}

function base64SizeMB(b64) {
  return (b64.length * 0.75) / (1024 * 1024);
}

async function handlePhoto(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;

  const status = document.getElementById('aiStatus');
  const statusText = document.getElementById('aiStatusText');
  status.className = 'ai-status active';
  statusText.textContent = 'Preparing photo...';

  try {
    let out = await compressImage(file, IMG_MAX_DIM, IMG_QUALITY);

    // 极端情况下再压一轮，确保远低于 n8n 的 8MB 上限
    let q = IMG_QUALITY;
    while (base64SizeMB(out.base64) > IMG_HARD_CAP && q > 0.4) {
      q -= 0.15;
      out = await compressImage(file, 1200, q);
    }
    if (base64SizeMB(out.base64) > IMG_HARD_CAP) {
      throw new Error('Photo is too large even after compression — please retake it closer to the label.');
    }

    document.getElementById('photoImg').src = out.dataUrl;
    document.getElementById('photoPreview').classList.add('active');

    const beforeMB = (file.size / (1024 * 1024)).toFixed(1);
    const afterMB  = base64SizeMB(out.base64).toFixed(2);
    await analyzeWithAI(out.base64, beforeMB, afterMB);
  } catch (err) {
    console.error('Photo error:', err);
    status.className = 'ai-status active error';
    statusText.textContent = '✕ ' + (err.message || 'Could not process the photo');
    setTimeout(() => { status.className = 'ai-status'; }, 6000);
  }
}

async function analyzeWithAI(base64Data, beforeMB, afterMB) {
  const status = document.getElementById('aiStatus');
  const statusText = document.getElementById('aiStatusText');
  status.className = 'ai-status active';
  statusText.textContent = 'Analyzing label with AI... (' + beforeMB + ' MB → ' + afterMB + ' MB)';

  try {
    const response = await fetchWithTimeout(WEBHOOK_OCR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-SU-Key': SU_KEY },
      // n8n OCR Guard 读的就是这两个字段
      body: JSON.stringify({ image_base64: base64Data, media_type: 'image/jpeg' })
    }, TIMEOUT_OCR);

    if (!response.ok) throw new Error(await describeError(response));

    // n8n "Respond: OCR Result" 直接返回解析好的 JSON 对象
    const parsed = await parseOcrResponse(response);
    const filled = fillFormFromAI(parsed);

    status.className = 'ai-status active success';
    statusText.textContent = filled > 0
      ? '✓ Label analyzed — ' + filled + ' field(s) pre-filled. Please verify.'
      : '✓ Analyzed, but nothing could be read. Please type it in.';
    setTimeout(() => { status.className = 'ai-status'; }, 5000);
  } catch (err) {
    console.error('AI analysis error:', err);
    const msg = (err && err.message) ? err.message : describeNetworkError(err);
    status.className = 'ai-status active error';
    statusText.textContent = '✕ ' + msg;
    if (/Auth failed/.test(msg)) document.getElementById('configTrigger').classList.add('alert');
    setTimeout(() => { status.className = 'ai-status'; }, 8000);
  }
}

async function parseOcrResponse(response) {
  const text = await response.text();
  let data = text;
  try {
    data = JSON.parse(text);
  } catch {
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Could not read the AI response');
    data = JSON.parse(m[0]);
  }
  // 有些 n8n 配置会二次编码成字符串
  if (typeof data === 'string') {
    const m = data.match(/\{[\s\S]*\}/);
    data = JSON.parse(m ? m[0] : data);
  }
  if (Array.isArray(data)) data = data[0] || {};
  if (data && typeof data.output === 'object' && data.output) data = data.output;
  if (!data || typeof data !== 'object') throw new Error('Could not read the AI response');
  return data;
}

function fillFormFromAI(data) {
  const fields = [
    ['inSender',      data.sender_courier],
    ['inAwb',         data.awb_number],
    ['inDescription', data.description],
    ['inPieces',      data.pieces],
    ['inWeight',      data.weight],
    ['inGst',         data.gst],
    ['inCompany',     data.company_name],
    ['inVessel',      data.vessel_name],
    ['inRemarks',     data.remarks]
  ];

  let count = 0;
  fields.forEach(([id, rawValue]) => {
    // 修复：OpenAI 可能返回数字（pieces: 1 / weight: 5.2），原来直接 .trim() 会抛异常
    if (rawValue === null || rawValue === undefined) return;
    const value = String(rawValue).trim();
    if (value === '' || value.toLowerCase() === 'null') return;

    const el = document.getElementById(id);
    if (!el) return;
    el.value = value;
    el.classList.add('ai-filled');
    el.classList.remove('field-error');
    count++;

    if (id === 'inSender') {
      document.querySelectorAll('#inForm .sender-chip').forEach(chip => {
        chip.classList.remove('suggest');
        chip.classList.toggle('active', chip.textContent.trim().toLowerCase() === value.toLowerCase());
      });
    }
  });
  return count;
}

function clearPhoto() {
  document.getElementById('photoPreview').classList.remove('active');
  document.getElementById('photoImg').src = '';
}

// ==========================================
// SENDER CHIPS
// ==========================================
function selectSender(chip, name) {
  document.querySelectorAll('#inForm .sender-chip').forEach(c => c.classList.remove('active', 'suggest'));
  chip.classList.add('active');
  const senderEl = document.getElementById('inSender');
  senderEl.value = name;
  senderEl.classList.remove('field-error');
}

// ==========================================
// PENDING QUEUE — 提交失败的单子不丢
// 只做「手动重发」，不自动重试，避免 Google Sheet 里出现重复行
// ==========================================
function getPending() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || []; }
  catch { return []; }
}
function setPending(list) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch {}
  renderPending();
}
function renderPending() {
  const list = getPending();
  const bar = document.getElementById('pendingBar');
  const txt = document.getElementById('pendingText');
  if (!list.length) { bar.classList.remove('active'); return; }
  const first = list[0];
  txt.textContent = list.length + ' parcel(s) not submitted (' +
    (first.awb_number || first.sender || 'no AWB') + (list.length > 1 ? ', ...' : '') + ')';
  bar.classList.add('active');
}
async function retryPending() {
  const btn = document.getElementById('pendingBtn');
  let list = getPending();
  if (!list.length) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  let sent = 0;

  while (list.length) {
    const item = list[0];
    try {
      const res = await fetchWithTimeout(WEBHOOK_IN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SU-Key': SU_KEY },
        body: JSON.stringify(item)
      }, TIMEOUT_SUBMIT);
      if (!res.ok) throw new Error(await describeError(res));
      list = list.slice(1);
      setPending(list);
      sent++;
    } catch (err) {
      showToast('Retry stopped: ' + ((err && err.message) || describeNetworkError(err)), 'error');
      break;
    }
  }

  btn.disabled = false;
  btn.textContent = 'Retry';
  if (sent > 0) showToast(sent + ' parcel(s) submitted', 'success');
  renderPending();
}

// ==========================================
// FORM SUBMISSION
// payload 字段名必须和 n8n "Format IN Data1" 里读的一致
// ==========================================
function buildPayload() {
  const cfg = loadConfig();
  const val = id => document.getElementById(id).value.trim();
  let remarks = val('inRemarks');
  if (!remarks && cfg.receivedBy) remarks = 'RECEIVED BY ' + cfg.receivedBy;

  return {
    type:         'IN',
    sender:       val('inSender'),
    awb_number:   val('inAwb'),
    description:  val('inDescription'),
    pieces:       val('inPieces'),
    weight:       val('inWeight'),
    gst:          val('inGst'),
    company_name: val('inCompany'),
    vessel_name:  val('inVessel'),
    remarks:      remarks
  };
}

function validate(payload) {
  document.getElementById('inAwb').classList.remove('field-error');
  document.getElementById('inSender').classList.remove('field-error');
  if (!payload.awb_number && !payload.sender) {
    document.getElementById('inAwb').classList.add('field-error');
    document.getElementById('inSender').classList.add('field-error');
    showToast('Enter at least an AWB number or a courier', 'error');
    return false;
  }
  return true;
}

async function submitForm() {
  const payload = buildPayload();
  if (!validate(payload)) return;

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const response = await fetchWithTimeout(WEBHOOK_IN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-SU-Key': SU_KEY },
      body: JSON.stringify(payload)
    }, TIMEOUT_SUBMIT);

    if (!response.ok) throw new Error(await describeError(response));

    // n8n "Respond: IN Success1" 返回 { success, message, timestamp }
    let stamp = '';
    try {
      const j = JSON.parse(await response.text());
      if (j && j.timestamp) stamp = ' · ' + j.timestamp;
    } catch {}

    showToast('Parcel IN recorded ✓' + stamp, 'success');
    clearForm();
  } catch (err) {
    console.error('Submit error:', err);
    const msg = (err && err.message) ? err.message : describeNetworkError(err);

    // 失败的单子存起来，人工点 Retry 重发，绝不静默丢数据
    const list = getPending();
    list.push(payload);
    setPending(list);

    if (/Auth failed/.test(msg)) document.getElementById('configTrigger').classList.add('alert');
    showToast('Not submitted — saved locally. ' + msg, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Parcel IN';
  }
}

// ==========================================
// DIAGNOSTICS — 一键判断 key 对不对
// 故意不带图片：n8n OCR Guard 的第 1 道校验会返回 NO_IMAGE(429)，
// 这条路径不会消耗每日 100 次的额度。
// ==========================================
async function runDiagnostics() {
  const btn = document.getElementById('btnDiagnose');
  const box = document.getElementById('diagResult');
  btn.disabled = true;
  btn.textContent = 'Testing...';
  box.className = 'diag-result active info';
  box.textContent = 'Contacting n8n...';

  try {
    const res = await fetchWithTimeout(WEBHOOK_OCR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-SU-Key': SU_KEY },
      body: JSON.stringify({ media_type: 'image/jpeg' })
    }, 20000);

    if (res.status === 429 || res.ok) {
      box.className = 'diag-result active ok';
      box.textContent = '✓ Connection OK. Webhook reachable and the key is accepted.';
      document.getElementById('configTrigger').classList.remove('alert');
    } else if (res.status === 401 || res.status === 403) {
      box.className = 'diag-result active bad';
      box.textContent = '✕ Key rejected (' + res.status + ').\nThe value in this app does not match the "X-SU-Key" credential in n8n. The administrator needs to update and redeploy the app.';
    } else if (res.status === 404) {
      box.className = 'diag-result active bad';
      box.textContent = '✕ Webhook not found (404).\nThe n8n workflow is probably deactivated.';
    } else {
      box.className = 'diag-result active bad';
      box.textContent = '✕ Unexpected response ' + res.status + '.\n' + (await describeError(res));
    }
  } catch (err) {
    box.className = 'diag-result active bad';
    box.textContent = '✕ ' + describeNetworkError(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Test connection to n8n';
  }
}

// ==========================================
// UTILITIES
// ==========================================
function clearForm() {
  ['inSender','inAwb','inDescription','inPieces','inWeight','inGst','inCompany','inVessel','inRemarks']
    .forEach(id => {
      const el = document.getElementById(id);
      el.value = '';
      el.classList.remove('ai-filled', 'field-error');
    });
  document.querySelectorAll('.sender-chip').forEach(c => c.classList.remove('active', 'suggest'));
  clearPhoto();
  stopBarcodeScan();
  document.getElementById('aiStatus').className = 'ai-status';
}

let toastTimer = null;
function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + (type || 'success') + ' show';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4000);
}

// 切到后台时关掉摄像头，避免指示灯长亮
document.addEventListener('visibilitychange', () => {
  if (document.hidden && scannerStream) stopBarcodeScan();
});

document.addEventListener('DOMContentLoaded', () => {
  populateConfig();
  renderPending();
});
</script>
